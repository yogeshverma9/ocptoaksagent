apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Values.deployment.namespace }}
spec:
  selector:
    matchLabels:
      app: pdf-gen
  replicas: {{ .Values.deployment.replicaCount }}
  template:
    metadata:
      labels:
        app: pdf-gen
    spec:
      containers:
        - name: pdf-gen
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["npm"]
          args: ["run", "start:prod"]
          resources:
              limits:
                cpu: 450m
                memory: "800Mi"
              requests:
                cpu: 100m
                memory: 200M
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: mongodb-connection-string
          env:
          {{- range .Values.envVars}}
          - name: {{ .name }}
            value: {{ .value | quote}}
          {{- end }}
---
