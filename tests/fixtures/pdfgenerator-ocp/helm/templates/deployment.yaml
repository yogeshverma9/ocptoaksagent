apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.largeInvoicesDeployment.name }}
  namespace: {{ .Values.largeInvoicesDeployment.namespace }}
spec:
  selector:
    matchLabels:
      app: pdf-gen
  replicas: {{ .Values.largeInvoicesDeployment.replicaCount }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pdf-gen
    spec:
      containers:      
        - name: pdf-gen-large-invoices
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["npm"]
          args: ["run", "start-large:prod"]
          resources:
            limits:
              cpu: 2000m
              memory: 20Gi
            requests:
              cpu: 100m
              memory: 1Gi
          envFrom:
            - secretRef:
                name: mongodb-connection-string
          env:
          {{- range .Values.envVars}}
          - name: {{ .name }}
            value: {{ .value | quote}}
          {{- end }}
---
