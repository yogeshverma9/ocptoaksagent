apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.service.label }}
  name: pdf-gen-service
  namespace: {{ .Values.deployment.namespace }}
spec:
  ports:
  - name: "8081"
    port: {{ .Values.service.portValue }}
    protocol: {{ .Values.service.portProtocol }}
    targetPort: {{ .Values.service.targetPort }}
  selector:
    app: {{ .Values.service.label }}
  sessionAffinity: None
  type: ClusterIP