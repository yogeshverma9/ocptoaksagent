- stage: NFT
  dependsOn: []
  variables:
  - name: 'ENVIRONMENT'
    value: BILLING_DEVOPS_PDFGEN_NFT
  - group: BILLING_DEVOPS_PDF_GENERATOR
  displayName: Deploy to NFT
  jobs:   
  - template: deploy.yaml
    parameters:
      buildNumber: ${{ parameters.buildNumber }}
      environment: BILLING_DEVOPS_PDFGEN_NFT
      endpoint: billing-pdfgen-nft
      values: nft_values.yaml

- stage: STG
  dependsOn: []
  variables:
  - name: 'ENVIRONMENT'
    value: BILLING_DEVOPS_PDFGEN_NPE04
  - group: BILLING_DEVOPS_PDF_GENERATOR
  displayName: Deploy to Staging
  jobs:   
  - template: deploy.yaml
    parameters:
      buildNumber: ${{ parameters.buildNumber }}
      environment: BILLING_DEVOPS_PDFGEN_NPE04
      endpoint: billing-pdfgen-npe04
      values: stg_values.yaml

- stage: PRD
  dependsOn: [STG]
  variables:
  - name: 'ENVIRONMENT'
    value: BILLING_DEVOPS_PDFGEN_PROD
  - group: BILLING_DEVOPS_PDF_GENERATOR
  displayName: Deploy to Production
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs: 
  - template: deploy.yaml
    parameters:
      buildNumber: ${{ parameters.buildNumber }}
      environment: BILLING_DEVOPS_PDFGEN_PROD
      endpoint: billing-pdfgen-prod
      values: prd_values.yaml