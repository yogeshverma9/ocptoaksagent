parameters:
  - name: buildNumber
    type: string
    default: latest

stages:
  - stage: DEV
    pool:
      name: az-dot-ci-nzn-npe
    dependsOn: []
    displayName: Deploy to Development
    variables:
      - group: BILLING_DEVOPS_PDF_GENERATOR
    jobs:
      - template: deploy.yaml
        parameters:
          buildNumber: ${{ parameters.buildNumber }}
          environment: BILLING_DEVOPS_PDFGEN_DEV01
          azureSubscription: tf-azurerm-spark-bill-dev-app-pdfgen-Spark
          azureResourceGroup: rg-bill-app-dev-nzn-001
          aksTargetClusterName: aks-bil-app-dev-nzn-002
          kubernetesNamespace: pdfgenerator
          values: dev_values.yaml

  - stage: INT
    pool:
      name: az-dot-ci-nzn-npe
    dependsOn: [DEV]
    displayName: Deploy to Integration
    variables:
      - group: BILLING_DEVOPS_PDF_GENERATOR
    jobs:
      - template: deploy.yaml
        parameters:
          buildNumber: ${{ parameters.buildNumber }}
          environment: BILLING_DEVOPS_PDFGEN_NPE04
          azureSubscription: tf-azurerm-spark-bill-test-app-pdfgen-Spark
          azureResourceGroup: rg-billing-app-test-nzn-001
          aksTargetClusterName: aks-bil-app-test-nzn-001
          kubernetesNamespace: pdfgenerator-int
          values: int_values.yaml

  - stage: NFT
    pool:
      name: az-dot-ci-nzn-npe
    dependsOn: [DEV]
    displayName: Deploy to NFT
    variables:
      - group: BILLING_DEVOPS_PDF_GENERATOR
    jobs:
      - template: deploy.yaml
        parameters:
          buildNumber: ${{ parameters.buildNumber }}
          environment: BILLING_DEVOPS_PDFGEN_NFT
          azureSubscription: tf-azurerm-spark-bill-stage-app-pdfgen-Spark
          azureResourceGroup: rg-bill-app-stage-nzn-001
          aksTargetClusterName: aks-bil-app-stage-nzn-001
          kubernetesNamespace: pdfgenerator-nft
          values: nft_values.yaml

